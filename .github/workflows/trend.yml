name: データマネジメント トレンド収集

on:
  schedule:
    - cron: '0 0 * * *'   # 毎朝9時JST
  workflow_dispatch:        # 手動実行ボタンも有効にする

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 💡【修正】1つのステップの中で、インストールと実行を連続して行います
      # 「run: |」の「|」は、複数行のコマンドをまとめて実行するという意味です
      - name: ライブラリ導入とトレンド収集の実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          pip install google-genai
          python main.py
